<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>OrchestrateView full-mount E2E harness</title>
    <!-- OrchestrateView is a height:100% flex column; the harness #root must
         give it a real viewport height, or the canvas collapses to 0px and
         ReactFlow's fitView stacks the nodes under the palette/inspector
         sidebars (Playwright then can't click them — "wf-palette intercepts
         pointer events"). In the real app, MainPanel provides this height. -->
    <style>html,body,#root{height:100%;margin:0;}</style>
    <!--
      OrchestrateView mount shim — drives the REAL OrchestrateView + the REAL
      @xyflow/react canvas (NOT the jsdom stub OrchestrateView.test.tsx replaces
      it with) so Playwright can assert what unit tests structurally cannot:
        - the live WorkflowNodeView renders `wf-node--status-<state>` classes
          as `workflow:progress` events arrive (#5 canvas coloring),
        - clicking a canvas node opens the editable NodeInspector (the inspector
          unlock — OrchestrateView no longer suppresses it via onSelectedChange),
        - the 状态 sidebar tab renders BlocksView for accumulated node_output
          blocks (#8).

      Like app.html this owns the full Tauri event shim: @tauri-apps/api/event's
      `listen` calls invoke('plugin:event|listen', {event, handler}) where
      `handler` is a transformCallback id. __EMIT_EVENT__(event, payload) then
      fires every registered callback with {id, event, payload} — the Event<T>
      shape OrchestrateView's listener expects. The spec calls it to feed
      workflow:progress events into orchestrateStore.applyEvent.
    -->
    <script>
      (function () {
        const callbacks = new Map(); // cbId -> wrapper fn (core.js transformCallback)
        let nextCbId = 1;
        let nextRid = 1;
        const eventListeners = Object.create(null); // eventName -> [cbId,...]
        // rid -> {event, cbId}: plugin:event|unlisten only knows the rid, so map
        // it back to the cbId to actually remove the listener (mirrors real Tauri;
        // without this, StrictMode's mount→unmount→remount leaves a stale listener
        // that double-applies every event).
        const listenerRids = new Map();

        window.__EMIT_EVENT__ = function (event, payload) {
          const ids = eventListeners[event] || [];
          for (const id of ids) {
            const fn = callbacks.get(id);
            if (fn) fn({ id: 0, event: event, payload: payload });
          }
        };

        window.__TAURI_INTERNALS__ = {
          metadata: {
            currentWindow: { label: 'main' },
            currentWebview: { label: 'main', windowLabel: 'main' },
          },
          transformCallback: function (fn /*, once */) {
            const id = nextCbId++;
            callbacks.set(id, fn);
            return id;
          },
          unregisterCallback: function (id) { callbacks.delete(id); },
          invoke: function (cmd, args) {
            args = args || {};
            switch (cmd) {
              // --- event plugin (listen/unlisten/emit) ---
              case 'plugin:event|listen': {
                const ev = args.event;
                const cbId = args.handler;
                (eventListeners[ev] || (eventListeners[ev] = [])).push(cbId);
                const rid = nextRid++;
                listenerRids.set(rid, { event: ev, cbId: cbId });
                return Promise.resolve(rid);
              }
              case 'plugin:event|unlisten': {
                const rid = args.eventId;
                const entry = listenerRids.get(rid);
                if (entry) {
                  const arr = eventListeners[entry.event];
                  if (arr) {
                    const idx = arr.indexOf(entry.cbId);
                    if (idx >= 0) arr.splice(idx, 1);
                  }
                  callbacks.delete(entry.cbId);
                  listenerRids.delete(rid);
                }
                return Promise.resolve();
              }
              case 'plugin:event|emit':
              case 'plugin:event|emit_to':
                return Promise.resolve();

              // --- orchestrate IPC boundary (only what OrchestrateView/WorkflowBuilder call) ---
              case 'list_workflow_templates':
                return Promise.resolve([]);
              case 'discover_agents_cmd':
                // agentOptions = agents.filter(installed).map(commandName)
                return Promise.resolve([
                  { agentType: 'claude_code', displayName: 'Claude Code', commandName: 'claude', installed: true, path: '/usr/local/bin/claude', supportsResume: true },
                ]);
              case 'get_providers_config':
                // modelOptions walks providers[].enabled && models[].enabled
                return Promise.resolve({
                  providers: [
                    {
                      id: 'zai', name: 'Z.AI', endpoint: 'https://open.bigmodel.cn/api/anthropic',
                      apiKey: 'sk-zai-demo', protocol: 'anthropic', enabled: true,
                      models: [{ id: 'glm-4.6', label: 'GLM-4.6', enabled: true, tier: 'strong' }],
                    },
                  ],
                  modelMapping: {},
                });
              case 'run_workflow':
                // OrchestrateView.handleRun awaits { run_id } then startRun.
                return Promise.resolve({ run_id: 'run-e2e', output: null });
              case 'list_workflows':
                return Promise.resolve([]);
              case 'create_workflow':
                return Promise.resolve({ id: 'wf-e2e', name: String(args.name ?? ''), yamlContent: String(args.yamlContent ?? ''), createdAt: 't', updatedAt: 't' });
              case 'update_workflow':
                return Promise.resolve({ id: String(args.id ?? ''), name: String(args.name ?? ''), yamlContent: String(args.yamlContent ?? ''), createdAt: 't', updatedAt: 't' });
              case 'delete_workflow':
                return Promise.resolve(null);
              case 'approve_workflow_step':
                return Promise.resolve(null);

              default:
                console.warn('[e2e-shim] unhandled invoke: ' + cmd, args);
                return Promise.resolve(null);
            }
          },
        };

        window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener: function () {} };
        console.info('[e2e-shim] OrchestrateView mount shim installed');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./orchestrate-main.tsx"></script>
  </body>
</html>
