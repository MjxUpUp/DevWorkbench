<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>LLM Trace E2E harness</title>
    <!--
      Tauri IPC shim (same shape as index.html / chat.html). TraceView's
      fetchTraces calls invoke('list_llm_traces', { sessionId }); the harness
      serves the recorded-shape fixture from window.__MOCK_INVOKE__ so the real
      IPC boundary shape (cmd name + camelCase args) is exercised against a real
      browser, while no provider is contacted.
    -->
    <script>
      window.__TAURI_INTERNALS__ = {
        invoke: async (cmd, args) => {
          (window.__INVOKE_CALLS__ = window.__INVOKE_CALLS__ || []).push({ cmd, args });
          const mock = window.__MOCK_INVOKE__;
          if (mock && Object.prototype.hasOwnProperty.call(mock, cmd)) {
            const v = mock[cmd];
            return typeof v === 'function' ? v(args) : v;
          }
          return null;
        },
        transformCallback: () => 0,
        unregisterCallback: () => {},
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./trace-main.tsx"></script>
  </body>
</html>
