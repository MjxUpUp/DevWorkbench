<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <title>TriggerMenu E2E harness</title>
    <!--
      Same Tauri IPC shim as settings.html: a classic head script runs before
      the deferred module entry, so @tauri-apps/api/core sees __TAURI_INTERNALS__
      when TriggerMenu calls invoke('list_skills'). Playwright seeds responses
      via window.__MOCK_INVOKE__ (addInitScript) and every call is recorded into
      window.__INVOKE_CALLS__ for assertions.
    -->
    <script>
      window.__TAURI_INTERNALS__ = {
        invoke: async (cmd, args) => {
          (window.__INVOKE_CALLS__ = window.__INVOKE_CALLS__ || []).push({ cmd, args });
          const mock = window.__MOCK_INVOKE__;
          if (mock && Object.prototype.hasOwnProperty.call(mock, cmd)) {
            const v = mock[cmd];
            return typeof v === 'function' ? v(args) : v;
          }
          return null;
        },
        transformCallback: () => 0,
        unregisterCallback: () => {},
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./trigger-main.tsx"></script>
  </body>
</html>
