name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Install npm dependencies
        run: npm ci

      # 反刷分自审硬执行：P4 的 F 集合（前端 invoke 清单）必须与 src/ 同步。
      # 重新生成 manifest 并要求 git diff 为空——任何漏跑 vite 就提交新 invoke 的
      # 变更会让 manifest 漂移（死按钮审计的真相源失准），CI 直接 FAIL。这条校验是
      # "双集合独立 grep" 立场的硬底，把"开发者自觉同步"升级为"CI 强制"。
      - name: Verify invoke-commands manifest is in sync
        run: |
          node scripts/gen-invoked-commands.mjs
          git diff --exit-code -- src/generated/invoked-commands.ts

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm test

      - name: Run Rust tests
        working-directory: src-tauri
        shell: bash
        run: |
          # dev-workbench (app_lib) 是 Tauri app crate，其 test 二进制静态链 wry/webview2
          # native 栈 → windows 加载即 0xc0000139 STATUS_ENTRYPOINT_NOT_FOUND（Tauri 固有，
          # mac/linux 不复现；mock runtime 是运行时 trait 替换，解不了 load-time 链接）。
          # windows 只跑不链 GUI 的 core crate（kernel-compose/kernel-core，已实测绿）。
          # 诚实代价：windows 完全不跑 dev-workbench 的 #[test] 单测 + tests/ 下 6 个集成
          # 测试（都链 app_lib → 链 webview2 → 同样 0xc0000139），由 mac/linux 全量兜底。
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo test --workspace --exclude dev-workbench -- --nocapture
          else
            cargo test -- --nocapture
          fi

      - name: Check Rust compilation
        working-directory: src-tauri
        run: cargo check
