[package]
name = "kernel-compose"
version = "0.1.0"
edition = "2021"
description = "DevWorkbench graph/chain orchestration engine (eino compose, Rust-native)"

[lib]
path = "src/lib.rs"

[dependencies]
kernel-core = { path = "../kernel-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
