[package]
name = "dev-workbench"
version = "1.0.6"
# Tauri bundler needs the main binary disambiguated: this crate builds TWO
# bins — `dev-workbench` (src/main.rs, the Tauri app) and `dev-workbench-acp`
# (src/bin/dev-workbench-acp.rs, the C1 ACP stdio server helper). Without
# `default-run`, `tauri build` errors "failed to find main binary" and refuses
# to bundle. Pin the Tauri app as the default; the ACP helper is still built
# on demand via `cargo build --bin dev-workbench-acp`.
default-run = "dev-workbench"
description = "一目了然 — 本地开发工作台"
authors = ["you"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# C1 ACP server binary — serves the kernel as an ACP-servable agent over stdio
# (see src/bin/dev-workbench-acp.rs). Built from the same lib crate, so it
# shares build_react_agent / EventBridge without duplicating logic.
[[bin]]
name = "dev-workbench-acp"
path = "src/bin/dev-workbench-acp.rs"

[workspace]
# Workspace root sits in src-tauri/ so tauri.conf.json relative paths
# (frontendDist: "../dist") keep working unchanged. The main crate (dev-workbench,
# i.e. `.`) stays the Tauri entry point; kernel-* crates hold the new eino-inspired
# kernel. Phase 0 only adds kernel-core (trait/schema shell); existing modules
# (agents/, knowledge/, quality/, mcp/) remain in the main crate and will migrate
# incrementally in later phases.
members = ["crates/kernel-core", "crates/kernel-compose"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
which = "7"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
git2 = { version = "0.20", features = ["vendored-openssl"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.34", features = ["bundled"] }
# Hook matcher regex mode (claude-code `matchesPattern` 3rd mode). Already in
# the lock transitively; declared direct so user_hooks can `use regex::Regex`.
regex = "1"
toml = "0.8"
thiserror = "2"
sha2 = "0.10"
notify = { version = "7", features = ["macos_kqueue"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync"] }
kernel-core = { path = "crates/kernel-core" }
kernel-compose = { path = "crates/kernel-compose" }
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"
serde_yaml = "0.9"
# C1 ACP client — drive external ACP-speaking coding agents (codex-acp / claude via
# ACP) over stdio JSON-RPC, mirroring deer-flow's invoke_acp_agent_tool. Default
# features only (the `unstable_*` gates are spec drafts we don't implement).
agent-client-protocol = "0.15"

[dev-dependencies]
tempfile = "3"
# BashTool shell-path 测试需串行：resolve_git_bash 读/写进程级 env
# （DEVWORKBENCH_BASH_PATH / ProgramFiles），并行测试会互相覆盖。
serial_test = "3"
